<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teste de HTML com CSS</title>
    <style>
        p{
            color: blue;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            background-color: aqua;
            padding: 10px;
            border: solid #ccc 25px;
            margin: 15px;
        }

        h1{
            background-color: red;
            color: white;
            margin-left: 15px;
        }
        hr{
            border-color: red;
        }

        em{
            color: black;
            background-color: green;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Cabeçalho de nível 01</h1>
    <p>
        Parágrafo de <em>texto</em>.
    </p>

    <hr>

</body>
</html>
